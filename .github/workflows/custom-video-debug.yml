name: Build custom LastWave video APK
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform and CMake
        run: sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'cmake;3.22.1'
      - name: Verify recording identity and playback cache
        run: |
          bash tools/test-recording-identity.sh
          bash tools/test-playback-mode-cache.sh
      - name: Test and build APK
        run: bash gradlew testDebugUnitTest assembleDebug --console=plain --stacktrace
      - name: Verify APK signature and package
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner" verify --verbose "$apk"
          "$(dirname "$apksigner")/aapt" dump badging "$apk" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)'
          sha256sum "$apk" > "$apk.sha256"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: LastWave-custom-video-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.sha256
          if-no-files-found: error
