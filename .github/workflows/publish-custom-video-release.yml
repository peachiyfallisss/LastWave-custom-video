name: Publish verified custom video APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-custom-video-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-v4.2.2-custom-video.3
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'peachiyfallisss/LastWave-custom-video'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '37142545259'
      SOURCE_SHA: 6ecc66d5e73dbfd81e098884f063ecf52a133b61
      RELEASE_TAG: v4.2.2-custom-video.3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6ecc66d5e73dbfd81e098884f063ecf52a133b61
          persist-credentials: false
      - name: Verify successful build and download its APK
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
          gh run download "$BUILD_RUN" --repo "$GH_REPO" --name LastWave-custom-video-debug --dir artifact
          python3 - <<'PY'
          import hashlib
          import shutil
          from pathlib import Path
          apks = list(Path("artifact").rglob("*.apk"))
          checksums = list(Path("artifact").rglob("*.apk.sha256"))
          assert len(apks) == 1 and len(checksums) == 1, "Expected one APK and its checksum"
          apk = apks[0]
          expected = checksums[0].read_text().split()[0]
          actual = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert actual == expected, "Downloaded APK checksum does not match the successful build"
          dest = Path("dist")
          dest.mkdir()
          name = "LastWave-custom-video-debug.apk"
          shutil.copy2(apk, dest / name)
          (dest / (name + ".sha256")).write_text(f"{actual}  {name}\n")
          print(f"Verified APK SHA-256: {actual}")
          PY
      - name: Package exact built source and release notes
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=LastWave-native/ --output=dist/LastWave-custom-video-source.zip "$SOURCE_SHA"
          cat > release-notes.md <<'NOTES'
          Videos now have a fullscreen button with landscape viewing, play/pause, seeking, and Back/exit controls. Entering or leaving fullscreen keeps the same player and position.

          Downloads preserve the exact selected YouTube recording instead of substituting studio audio or another concert upload. Playlist bulk downloads now pass each original video ID. Original-recording downloads use the audio quality available from that YouTube upload.

          Locally saved YouTube playlists keep their original recording URLs, and live/studio uploads remain separate even when their display titles match. Source-verified downloads are reused; old name-only downloads are not trusted as proof of a matching performance. Failed extraction reports an error rather than changing the recording.

          **Download:** LastWave-custom-video-debug.apk below. Android 10 or newer; package com.lastwave.app.custom.

          Built from commit 6ecc66d5e73dbfd81e098884f063ecf52a133b61.
          [Successful build and tests](https://github.com/peachiyfallisss/LastWave-custom-video/actions/runs/37142545259).
          The release tag includes the publishing-workflow update; app source is identical to the tested commit above. The APK checksum and exact built source archive are included. Fullscreen behavior and the reported Phantom Siita/Ado songs still need checking on your phone.
          NOTES
      - name: Publish release and attach verified files
        run: |
          set -euo pipefail
          # The release tag includes only the publishing-workflow update beyond the built source.
          test "$(gh api "repos/$GH_REPO/compare/$SOURCE_SHA...$GITHUB_SHA" --jq '[.files[].filename] == [".github/workflows/publish-custom-video-release.yml"]')" = true
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "LastWave custom video — fullscreen and recording fixes" --notes-file release-notes.md --latest dist/LastWave-custom-video-debug.apk dist/LastWave-custom-video-debug.apk.sha256 dist/LastWave-custom-video-source.zip
