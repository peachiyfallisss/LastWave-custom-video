name: Publish verified custom video APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-custom-video-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-v4.2.2-custom-video.6
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'peachiyfallisss/LastWave-custom-video'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '37151505784'
      SOURCE_SHA: 7f746771522191f6e6026966a655001d83a21995
      RELEASE_TAG: v4.2.2-custom-video.6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7f746771522191f6e6026966a655001d83a21995
          persist-credentials: false
      - name: Verify successful build and download its APK
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
          gh run download "$BUILD_RUN" --repo "$GH_REPO" --name LastWave-custom-video-debug --dir artifact
          python3 - <<'PY'
          import hashlib
          import shutil
          from pathlib import Path
          apks = list(Path("artifact").rglob("*.apk"))
          checksums = list(Path("artifact").rglob("*.apk.sha256"))
          assert len(apks) == 1 and len(checksums) == 1, "Expected one APK and its checksum"
          apk = apks[0]
          expected = checksums[0].read_text().split()[0]
          actual = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert actual == expected, "Downloaded APK checksum does not match the successful build"
          dest = Path("dist")
          dest.mkdir()
          name = "LastWave-custom-video-debug.apk"
          shutil.copy2(apk, dest / name)
          (dest / (name + ".sha256")).write_text(f"{actual}  {name}\n")
          print(f"Verified APK SHA-256: {actual}")
          PY
      - name: Package exact built source and release notes
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=LastWave-native/ --output=dist/LastWave-custom-video-source.zip "$SOURCE_SHA"
          cat > release-notes.md <<'NOTES'
          Qualified offline listens are saved across app restarts and automatically submitted after connectivity returns, with YouTube history sync enabled. Settings shows the pending count. YouTube may show late listens at sync time; submitting history does not guarantee badge credit. Disconnecting, changing channels, starting a new login, or disabling history sync clears pending listens; refreshing the current session keeps them. Uncertain submission outcomes are not replayed.

          Song downloads and both playlist download menus now ask for Audio only or Audio + video. Video saves the selected rendition and its own soundtrack for offline playback, including from Downloads. Existing verified audio files can gain video without downloading their audio again. A failed or cancelled video transfer preserves completed audio and reports the failure. Private video files are removed with their associated download.

          Interactive playback starts from the first usable source instead of waiting several seconds for lossless discovery. Direct YouTube and InnerTubeX extraction run together, and a failed direct-client race ends immediately. Eligible quality upgrades continue in the background. Initial playback buffering is reduced from 1.5s to 0.5s.

          YouTube/Bilibili progressive video, direct MP4/WebM links, and device videos support saving. Custom HLS/DASH manifest links remain playback-only and report a clear download error. Existing fullscreen and configurable hidden Audio/Video controls remain available.

          **Download:** LastWave-custom-video-debug.apk below. Android 10 or newer; package com.lastwave.app.custom, version 4.2.2-custom-video.6 (code 25).

          Built from commit 7f746771522191f6e6026966a655001d83a21995.
          [Successful build and tests](https://github.com/peachiyfallisss/LastWave-custom-video/actions/runs/37151505784).
          The release tag includes the publishing-workflow update; app source is identical to the tested commit above. The APK checksum and exact built source archive are included. Actual playback speed, background reconnects, and video playback still need checking on your phone.
          NOTES
      - name: Publish release and attach verified files
        run: |
          set -euo pipefail
          # The release tag includes only the publishing-workflow update beyond the built source.
          test "$(gh api "repos/$GH_REPO/compare/$SOURCE_SHA...$GITHUB_SHA" --jq '[.files[].filename] == [".github/workflows/publish-custom-video-release.yml"]')" = true
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "LastWave custom video — offline sync and downloads" --notes-file release-notes.md --latest dist/LastWave-custom-video-debug.apk dist/LastWave-custom-video-debug.apk.sha256 dist/LastWave-custom-video-source.zip
