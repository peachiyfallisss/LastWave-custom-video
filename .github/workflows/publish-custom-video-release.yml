name: Publish verified custom video APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-custom-video-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-v4.2.2-custom-video.7
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'peachiyfallisss/LastWave-custom-video'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '37154489441'
      SOURCE_SHA: b1b0ff63b40e880fe464d1fe38eadef0997525f3
      RELEASE_TAG: v4.2.2-custom-video.7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b1b0ff63b40e880fe464d1fe38eadef0997525f3
          persist-credentials: false
      - name: Verify successful build and download its APK
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
          gh run download "$BUILD_RUN" --repo "$GH_REPO" --name LastWave-custom-video-debug --dir artifact
          python3 - <<'PY'
          import hashlib
          import shutil
          from pathlib import Path
          apks = list(Path("artifact").rglob("*.apk"))
          checksums = list(Path("artifact").rglob("*.apk.sha256"))
          assert len(apks) == 1 and len(checksums) == 1, "Expected one APK and its checksum"
          apk = apks[0]
          expected = checksums[0].read_text().split()[0]
          actual = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert actual == expected, "Downloaded APK checksum does not match the successful build"
          dest = Path("dist")
          dest.mkdir()
          name = "LastWave-custom-video-debug.apk"
          shutil.copy2(apk, dest / name)
          (dest / (name + ".sha256")).write_text(f"{actual}  {name}\n")
          print(f"Verified APK SHA-256: {actual}")
          PY
      - name: Package exact built source and release notes
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=LastWave-native/ --output=dist/LastWave-custom-video-source.zip "$SOURCE_SHA"
          cat > release-notes.md <<'NOTES'
          Playlist downloads now run two songs simultaneously by default. Choose 1–4 songs at once in Settings > Audio & Playback > Downloads > Simultaneous downloads, or find it through Settings search.

          Each song's audio and optional video share one download slot. Raising the limit starts waiting songs immediately; lowering it allows current downloads to finish before starting more. Waiting songs keep their queue order. Cancellation returns reserved capacity, and clearing downloads waits for running and queued jobs to stop.

          New audio and companion lyrics files use stable identity suffixes to prevent simultaneous downloads with matching or sanitized filenames from overwriting one another. Existing verified downloads are still reusable.

          Offline history sync, Audio only / Audio + video downloads, exact selected recordings, fullscreen video, and configurable hidden Audio/Video controls remain available.

          **Download:** LastWave-custom-video-debug.apk below. Android 10 or newer; package com.lastwave.app.custom, version 4.2.2-custom-video.7 (code 26).

          Built from commit b1b0ff63b40e880fe464d1fe38eadef0997525f3.
          [Successful build and tests](https://github.com/peachiyfallisss/LastWave-custom-video/actions/runs/37154489441).
          The release tag includes the publishing-workflow update; app source is identical to the tested commit above. The APK checksum and exact built source archive are included. Actual download speed depends on your phone, connection, and media providers; simultaneous downloads still need checking on your phone.
          NOTES
      - name: Publish release and attach verified files
        run: |
          set -euo pipefail
          # The release tag includes only the publishing-workflow update beyond the built source.
          test "$(gh api "repos/$GH_REPO/compare/$SOURCE_SHA...$GITHUB_SHA" --jq '[.files[].filename] == [".github/workflows/publish-custom-video-release.yml"]')" = true
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "LastWave custom video — simultaneous downloads" --notes-file release-notes.md --latest dist/LastWave-custom-video-debug.apk dist/LastWave-custom-video-debug.apk.sha256 dist/LastWave-custom-video-source.zip
